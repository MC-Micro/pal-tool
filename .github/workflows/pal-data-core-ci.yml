name: Pal Data Core CI

on:
  push:
    branches:
      - main
      - "breeder/**"
      - "feature/**"
      - "release/**"
    paths:
      - "tools/pal-data-core/**"
      - ".github/workflows/pal-data-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/pal-data-core/**"
      - ".github/workflows/pal-data-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: pal-data-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore pinned dependencies
        run: dotnet restore tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj

      - name: Compile without warnings
        run: >-
          dotnet build
          tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj
          --configuration Release
          --no-restore
          --warnaserror

      - name: Validate versioned table catalog
        run: >-
          dotnet run
          --project tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj
          --configuration Release
          --no-build
          --
          validate-catalog
          --catalog tools/pal-data-core/catalog.v1.json
