name: Breeder AI Phase 0 CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "breeder/**"
      - "feature/**"
    paths:
      - "AGENTS.md"
      - "apps/breeder-ai/**"
      - "data/palworld-breeding/**"
      - "data/palworld-core/**"
      - "docs/BREEDER_AI_*.md"
      - ".github/workflows/breeder-ai-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "apps/breeder-ai/**"
      - "data/palworld-breeding/**"
      - "data/palworld-core/**"
      - "docs/BREEDER_AI_*.md"
      - ".github/workflows/breeder-ai-ci.yml"

permissions:
  contents: read

concurrency:
  group: breeder-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate local-only Phase 0 spike
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/breeder-ai
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/breeder-ai/pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical repository data
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-data.mjs

      - name: Run Phase 0 checks
        run: pnpm run ci
