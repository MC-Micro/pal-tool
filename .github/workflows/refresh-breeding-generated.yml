name: Refresh Breeding Generated Artifacts (feature branch)

on:
  push:
    branches:
      - breeder/core-refresh-1.0.3
    paths:
      - "data/palworld-breeding/**"
      - "services/breeding-api/src/**"
      - "services/breeding-api/scripts/**"
      - "services/breeding-api/test/**"
      - ".github/workflows/refresh-breeding-generated.yml"

permissions:
  contents: write

concurrency:
  group: breeding-generated-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/breeder/core-refresh-1.0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/breeding-api

    steps:
      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: breeder/core-refresh-1.0.3
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/breeding-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate derived reference
        run: pnpm run generate

      - name: Validate generated reference
        run: pnpm run validate

      - name: Verify deterministic generation
        run: pnpm run check:deterministic

      - name: Commit generated artifacts when changed
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          changes="$(git status --porcelain --untracked-files=all -- services/breeding-api/generated/)"
          if [[ -z "$changes" ]]; then
            echo "Generated artifacts already match canonical inputs."
            exit 0
          fi
          printf '%s\n' "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/breeding-api/generated/reference.json services/breeding-api/generated/special-child-impact.json
          git commit -m "chore: regenerate breeding reference"
          git push origin HEAD:breeder/core-refresh-1.0.3

# Temporary feature-branch helper for the 1.0.3 core refresh.
# It never runs on main and never modifies canonical source data.
