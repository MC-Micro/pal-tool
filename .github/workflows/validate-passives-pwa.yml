name: Validate legacy Passives PWA

on:
  push:
    branches: [main, 'release/**', 'feature/**', 'refactor/**']
    paths:
      - 'apps/passives-pwa/**'
      - '.github/workflows/validate-passives-pwa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/passives-pwa/**'
      - '.github/workflows/validate-passives-pwa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Validate frozen legacy app
        run: node apps/passives-pwa/scripts/validate.mjs
