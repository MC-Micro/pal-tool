name: Apply Breeder Core Rule Refresh (one-shot)

on:
  push:
    branches:
      - breeder/core-refresh-1.0.3
    paths:
      - ".github/workflows/apply-breeder-core-rule-refresh.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/breeder/core-refresh-1.0.3'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: breeder/core-refresh-1.0.3
          fetch-depth: 0

      - name: Apply canonical rule migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          build_path = root / 'services/breeding-api/scripts/build-reference.ts'
          validate_path = root / 'services/breeding-api/scripts/validate-reference.ts'
          rules_path = root / 'data/palworld-breeding/breeding_rules.json'
          manifest_path = root / 'data/palworld-breeding/manifest.json'
          analysis_path = root / 'data/palworld-breeding/analysis/anubis_jolthog_route.json'

          build = build_path.read_text()
          old_order = '''const REQUIRED_DECISION_ORDER = [
            "same_species_identity_override",
            "unique_combo_override",
            "eligible_candidate_pool",
            "rounded_average",
            "nearest_combi_rank",
            "equidistant_different_ranks_parent_rarity_average",
            "equidistant_rarity_lower_rarity",
            "equidistant_equal_rarity_higher_combi_rank",
            "same_rank_duplicate_resolution",
          ] as const;'''
          new_order = '''const REQUIRED_DECISION_ORDER = [
            "same_species_identity_override",
            "unique_combo_override",
            "eligible_candidate_pool",
            "rounded_average",
            "nearest_combi_rank",
            "equidistant_higher_combi_duplicate_priority",
            "non_variant_before_variant",
            "lower_internal_index",
          ] as const;'''
          if old_order not in build:
              raise SystemExit('required decision order block not found')
          build = build.replace(old_order, new_order)
          build = build.replace(
              '"Direct Palworld 1.0 egg tests on 2026-07-13 resolved both former release blockers: special children are excluded from normal-formula candidates, and fully equal cross-rank ties select the higher CombiRank.",',
              '"Direct Palworld egg tests and the current 1.0.3 independent extraction agree that special children are excluded from normal-formula candidates and equal-distance candidates resolve by higher CombiDuplicatePriority; in the current eligible pool this tracks the higher CombiRank.",'
          )
          build = build.replace(
              '"Palworld.gg is documented only as a non-authoritative manual cross-check and is never queried by the build or Worker.",',
              '"External calculators and extraction projects are non-authoritative cross-checks only and are never runtime dependencies of the build or Worker.",'
          )

          old_conflict = re.compile(r'''  const equalTieParentAId = findUniquePalId\(pals, "Mutant"\);.*?\n  return conflicts;''', re.S)
          if not old_conflict.search(build):
              raise SystemExit('legacy equal-tie conflict block not found')
          new_conflict = '''  const equalTieParentAId = findUniquePalId(pals, "Mutant");
            const equalTieParentBId = findUniquePalId(pals, "NaughtyCat");
            const penkingId = findUniquePalId(pals, "CaptainPenguin");
            const equalTieActual = resolveBasePair(equalTieParentAId, equalTieParentBId);
            const equalTieChild = pals[equalTieActual.childId];
            if (equalTieChild === undefined) throw new Error("Priority-tie fixture child lookup failed");
            if (
              equalTieActual.childId !== penkingId ||
              !equalTieActual.appliedTieBreaks?.includes(
                "equidistant_higher_combi_duplicate_priority",
              )
            ) {
              conflicts.push({
                code: "LUNARIS_GRINTALE_PRIORITY_TIE_CONFLICT",
                description:
                  "The verified Lunaris + Grintale result requires Penking under the global higher-CombiDuplicatePriority equal-distance rule.",
                parents: ["Lunaris", "Grintale"],
                expected: "Penking via equidistant_higher_combi_duplicate_priority",
                canonicalActual: equalTieChild.name_en,
                canonicalReason: `target=${equalTieActual.targetRank}; applied=${equalTieActual.appliedTieBreaks?.join(",") ?? "none"}`,
                blocking: true,
              });
            }

            const snockId = findUniquePalId(pals, "ElecSnail");
            const jolthogId = findUniquePalId(pals, "Hedgehog");
            const turtacleId = findUniquePalId(pals, "TentacleTurtle");
            const snockActual = resolveBasePair(snockId, jolthogId);
            const snockChild = pals[snockActual.childId];
            if (snockChild === undefined) throw new Error("Snock/Jolthog fixture child lookup failed");
            if (
              snockActual.childId !== turtacleId ||
              !snockActual.appliedTieBreaks?.includes(
                "equidistant_higher_combi_duplicate_priority",
              )
            ) {
              conflicts.push({
                code: "SNOCK_JOLTHOG_PRIORITY_TIE_CONFLICT",
                description:
                  "The direct Snock + Jolthog egg test and current 1.0.3 cross-check require Turtacle without a pair-specific override.",
                parents: ["Snock", "Jolthog"],
                expected: "Turtacle via equidistant_higher_combi_duplicate_priority",
                canonicalActual: snockChild.name_en,
                canonicalReason: `target=${snockActual.targetRank}; applied=${snockActual.appliedTieBreaks?.join(",") ?? "none"}`,
                blocking: true,
              });
            }

            return conflicts;'''
          build = old_conflict.sub(new_conflict, build, count=1)
          build_path.write_text(build)

          validate = validate_path.read_text()
          validate = validate.replace('impact.changedPairCount === 13_785', 'impact.changedPairCount === 13_479')
          validate = validate.replace('effective_pair_results_changed_by_special_child_exclusion === 13_785', 'effective_pair_results_changed_by_special_child_exclusion === 13_479')
          validate = validate.replace('anubisAnalysis.canonical_rules_schema_version === 4', 'anubisAnalysis.canonical_rules_schema_version === 5')
          validate = validate.replace('anubisAnalysis.canonical_manifest_schema_version === 4', 'anubisAnalysis.canonical_manifest_schema_version === 5')
          patch_pattern = re.compile(r'''    \{\n      name: "patch check is version-scoped and current",\n      ok:\n        generated\.status\.patchCheck\.status === "current" &&\n        generated\.status\.patchCheck\.checked_game_version === "1\.0" &&\n        generated\.status\.patchCheck\.checked_on === "2026-07-13" &&\n        generated\.status\.patchCheck\.build_verified === false &&\n        generated\.status\.patchCheck\.requires_recheck_after_newer_patch,\n    \},''')
          new_patch_check = '''    {
              name: "patch check is version-scoped and freshness-aware",
              ok:
                (generated.status.patchCheck.status === "current" ||
                  generated.status.patchCheck.status === "needs_review" ||
                  generated.status.patchCheck.status === "unknown") &&
                generated.status.patchCheck.checked_game_version.length > 0 &&
                generated.status.patchCheck.checked_on.length > 0 &&
                generated.status.patchCheck.requires_recheck_after_newer_patch,
              detail: `${generated.status.patchCheck.status}; game=${generated.status.patchCheck.checked_game_version}; build=${generated.status.patchCheck.checked_game_build ?? "unverified"}`,
            },'''
          validate, replacements = patch_pattern.subn(new_patch_check, validate, count=1)
          if replacements != 1:
              raise SystemExit(f'legacy patch validation block replacements={replacements}')
          validate = validate.replace(
              'const releaseOk = structuralOk && generated.validation.conflicts.length === 0;',
              'const releaseOk =\n    structuralOk &&\n    generated.validation.conflicts.length === 0 &&\n    generated.status.patchCheck.status === "current";'
          )
          validate_path.write_text(validate)

          rules = json.loads(rules_path.read_text())
          rules['schema_version'] = 5
          rules['generated_at_utc'] = '2026-08-30T11:05:00Z'
          rules['game_reference'] = 'Palworld 1.0 historical tables with 1.0.3 rule revalidation in progress'
          rules['decision_order'] = [
              {'order': 1, 'rule': 'same_species_identity_override', 'description_de': 'Sind beide Eltern dieselbe Pal-Art, ist das Kind wieder genau diese Pal-Art. Diese globale Regel wird vor der Sondertabelle und vor der Werteformel angewendet.'},
              {'order': 2, 'rule': 'unique_combo_override', 'description_de': 'Steht das Elternpaar einschließlich möglicher Geschlechtsvorgabe in special_combinations.json, gilt das dort hinterlegte Kind unabhängig von der normalen Werteformel.'},
              {'order': 3, 'rule': 'eligible_candidate_pool', 'description_de': 'Für die normale Formel werden ausschließlich Pals mit CombiRank > 0 und IgnoreCombi = false verwendet, deren internal_name nicht als child_internal in special_combinations.json vorkommt. Die Spezialkindmenge wird dynamisch aus der Sondertabelle abgeleitet. Same-Species und direkte Specials bleiben gültig.'},
              {'order': 4, 'rule': 'rounded_average', 'formula': 'target = floor((parent_a.combi_rank + parent_b.combi_rank + 1) / 2)', 'description_de': 'Der Zielwert wird aus beiden CombiRanks gebildet. Bei den aktuellen durch 10 teilbaren Rängen entspricht dies dem arithmetischen Mittel.'},
              {'order': 5, 'rule': 'nearest_combi_rank', 'description_de': 'Gewählt werden zunächst alle zulässigen Kinder mit dem kleinsten absoluten Abstand zum Zielwert.'},
              {'order': 6, 'rule': 'equidistant_higher_combi_duplicate_priority', 'description_de': 'Bleiben mehrere Kandidaten mit gleichem Rangabstand übrig, gewinnt die höhere CombiDuplicatePriority. Die Seltenheit der Eltern oder Kinder ist kein Zucht-Tie-Breaker.', 'confidence': 'verified_by_direct_tests_and_current_1_0_3_independent_extraction'},
              {'order': 7, 'rule': 'non_variant_before_variant', 'description_de': 'Ist auch die CombiDuplicatePriority gleich, wird die Nicht-Variante vor einer Variante gewählt.', 'confidence': 'current_game_table_semantics_and_cross_checks'},
              {'order': 8, 'rule': 'lower_internal_index', 'description_de': 'Bleiben Priorität und Variantenstatus gleich, entscheidet die niedrigere interne Tabellenreihenfolge deterministisch.', 'confidence': 'current_table_order_fallback'}
          ]
          rules['important_notes'] = [
              'CombiDuplicatePriority ist der globale Gleichstandsentscheid für gleich weit vom Zielwert entfernte normale Kandidaten.',
              'Die Paldeck-Nummer ist kein Zuchtwert und kein Tie-Breaker.',
              'Rarity wird nicht zur Auswahl des normalen Kindes verwendet.',
              'Gleichartige Eltern werden durch die globale Identitätsregel behandelt.',
              'Arten aus special_combinations.child_internal sind aus dem normalen Formel-Kandidatenpool ausgeschlossen; Same-Species und direkte Specials bleiben gültig.',
              'Snock + Jolthog ist eine Pflichtregression für die globale Priority-Regel und darf nicht als Einzelfall-Hardcode implementiert werden.',
              'Der Datenbestand selbst bleibt needs_review, bis die kanonischen 1.0.3-Tabellen vollständig importiert und gegen Build/Quellen verifiziert sind.'
          ]
          rules_path.write_text(json.dumps(rules, ensure_ascii=False, indent=2) + '\n')

          manifest = json.loads(manifest_path.read_text())
          manifest['schema_version'] = 5
          manifest['generated_at_utc'] = '2026-08-30T11:05:00Z'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          analysis = json.loads(analysis_path.read_text())
          analysis['canonical_rules_schema_version'] = 5
          analysis['canonical_manifest_schema_version'] = 5
          analysis['canonical_counts']['effective_pair_results_changed_by_special_child_exclusion'] = 13479
          analysis_path.write_text(json.dumps(analysis, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit migrated rules and validators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/palworld-breeding/breeding_rules.json \
            data/palworld-breeding/manifest.json \
            data/palworld-breeding/analysis/anubis_jolthog_route.json \
            services/breeding-api/scripts/build-reference.ts \
            services/breeding-api/scripts/validate-reference.ts
          git diff --cached --check
          git commit -m "refactor: canonicalize breeding priority rule"
          git push origin HEAD:breeder/core-refresh-1.0.3

# One-shot migration helper. Remove before the final PR is marked ready.
