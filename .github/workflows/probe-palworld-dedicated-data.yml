name: Probe Palworld Dedicated Server Data (temporary)

on:
  push:
    branches:
      - breeder/core-refresh-1.0.3
    paths:
      - ".github/workflows/probe-palworld-dedicated-data.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/breeder/core-refresh-1.0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download official SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"

      - name: Inspect Palworld Dedicated Server app metadata
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print 2394010 \
            +quit | tee "$RUNNER_TEMP/palserver-app-info.txt"
          grep -E '"(appid|name|buildid|oslist|FreeToDownload)"' "$RUNNER_TEMP/palserver-app-info.txt" | head -80 || true

      - name: Download free Palworld Dedicated Server anonymously
        shell: bash
        run: |
          set -euo pipefail
          # Use Pocketpair's documented default SteamCMD layout here. The first probe used
          # force_install_dir and Steam returned "Missing configuration" on the hosted runner.
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login anonymous \
            +app_update 2394010 validate \
            +quit

      - name: Report build and PAK inventory
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find "$HOME" "$RUNNER_TEMP" -name appmanifest_2394010.acf -print -quit 2>/dev/null || true)"
          server_dir="$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/common/PalServer' -print -quit 2>/dev/null || true)"
          echo "Dedicated Server manifest: ${manifest:-not-found}"
          echo "Dedicated Server directory: ${server_dir:-not-found}"
          if [[ -n "$manifest" && -f "$manifest" ]]; then
            grep -E '"(appid|buildid|LastUpdated)"' "$manifest" || true
          fi
          test -n "$server_dir"
          echo "Disk usage:"
          du -sh "$server_dir"
          echo "PAK/IoStore files:"
          find "$server_dir" -type f \( -name '*.pak' -o -name '*.utoc' -o -name '*.ucas' \) -printf '%s\t%p\n' | sort -n

      - name: Confirm packaged game data is present
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/common/PalServer' -print -quit 2>/dev/null || true)"
          pak_count="$(find "$server_dir" -type f -name '*.pak' | wc -l)"
          test "$pak_count" -gt 0
          echo "Found $pak_count PAK file(s); extraction is the next gated step."

# Temporary diagnostic workflow. It downloads only Pocketpair's free Steam dedicated-server tool,
# reads metadata and file names, and never commits extracted game data. Remove before final PR.
