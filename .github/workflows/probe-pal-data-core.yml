name: Probe Pal Data Core

on:
  workflow_dispatch:
  push:
    branches:
      - "breeder/**"
    paths:
      - ".github/workflows/probe-pal-data-core.yml"
      - "tools/pal-data-core/**"

permissions:
  contents: read

concurrency:
  group: pal-data-core-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare acquisition scripts
        shell: bash
        run: chmod +x tools/pal-data-core/scripts/*.sh

      - name: Install SteamCMD
        shell: bash
        run: tools/pal-data-core/scripts/install-steamcmd.sh "$RUNNER_TEMP/steamcmd"

      - name: Resolve current official Dedicated Server build
        id: build
        shell: bash
        run: |
          build_id="$(tools/pal-data-core/scripts/query-build-id.sh "$RUNNER_TEMP/steamcmd/steamcmd.sh")"
          test -n "$build_id"
          echo "id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Official Palworld Dedicated Server build: $build_id"

      - name: Download official Dedicated Server
        shell: bash
        run: |
          tools/pal-data-core/scripts/download-server.sh \
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            "$RUNNER_TEMP/palworld-server"

      - name: Build Data Core extractor
        shell: bash
        run: |
          dotnet --version
          dotnet restore tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj
          dotnet build \
            tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj \
            --configuration Release \
            --no-restore \
            --warnaserror

      - name: Probe current server tables without external mappings
        shell: bash
        run: |
          dotnet run \
            --project tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj \
            --configuration Release \
            --no-build \
            -- \
            probe \
            --pak-dir "$RUNNER_TEMP/palworld-server/Pal/Content/Paks" \
            --catalog "tools/pal-data-core/catalog.v1.json" \
            --output "$RUNNER_TEMP/pal-data-core-probe.json" \
            --build-id "${{ steps.build.outputs.id }}"

          echo "----- Pal Data Core probe report -----"
          cat "$RUNNER_TEMP/pal-data-core-probe.json"

      - name: Build deterministic technical snapshot twice
        shell: bash
        run: |
          project="tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj"
          pak_dir="$RUNNER_TEMP/palworld-server/Pal/Content/Paks"
          build_id="${{ steps.build.outputs.id }}"
          catalog="tools/pal-data-core/catalog.v1.json"

          dotnet run --project "$project" --configuration Release --no-build -- \
            snapshot \
            --pak-dir "$pak_dir" \
            --catalog "$catalog" \
            --output "$RUNNER_TEMP/pal-data-core-candidate/core-snapshot-a.json" \
            --summary "$RUNNER_TEMP/pal-data-core-candidate/core-summary-a.json" \
            --build-id "$build_id"

          dotnet run --project "$project" --configuration Release --no-build -- \
            snapshot \
            --pak-dir "$pak_dir" \
            --catalog "$catalog" \
            --output "$RUNNER_TEMP/core-snapshot-b.json" \
            --summary "$RUNNER_TEMP/core-summary-b.json" \
            --build-id "$build_id"

          cmp "$RUNNER_TEMP/pal-data-core-candidate/core-snapshot-a.json" "$RUNNER_TEMP/core-snapshot-b.json"
          cmp "$RUNNER_TEMP/pal-data-core-candidate/core-summary-a.json" "$RUNNER_TEMP/core-summary-b.json"

          echo "----- Technical snapshot summary -----"
          cat "$RUNNER_TEMP/pal-data-core-candidate/core-summary-a.json"

      - name: Build deterministic field and table inventory twice
        shell: bash
        run: |
          project="tools/pal-data-core/PalDataCore.Extractor/PalDataCore.Extractor.csproj"
          pak_dir="$RUNNER_TEMP/palworld-server/Pal/Content/Paks"
          catalog="tools/pal-data-core/catalog.v1.json"
          build_id="${{ steps.build.outputs.id }}"

          dotnet run --project "$project" --configuration Release --no-build -- \
            inventory \
            --pak-dir "$pak_dir" \
            --catalog "$catalog" \
            --output "$RUNNER_TEMP/pal-data-core-candidate/core-inventory-a.json" \
            --build-id "$build_id"

          dotnet run --project "$project" --configuration Release --no-build -- \
            inventory \
            --pak-dir "$pak_dir" \
            --catalog "$catalog" \
            --output "$RUNNER_TEMP/core-inventory-b.json" \
            --build-id "$build_id"

          cmp "$RUNNER_TEMP/pal-data-core-candidate/core-inventory-a.json" "$RUNNER_TEMP/core-inventory-b.json"

      - name: Upload normalized review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pal-data-core-candidate-${{ steps.build.outputs.id }}
          path: ${{ runner.temp }}/pal-data-core-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

# The expensive full-server gate runs for Data Core changes on breeder branches and
# explicit workflow_dispatch. Pull requests use the separate compile/catalog CI gate.
# No PAKs, mappings, raw DataTables, or original game assets are committed or uploaded;
# the artifact contains only deterministic normalized candidate JSON for review.
# Canonical publication remains a later review-gated workflow.
